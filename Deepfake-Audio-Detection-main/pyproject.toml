[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-audio-detection"
version = "0.1.0"
description = "Reproducible speech deepfake detection research project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "librosa>=0.10.2,<1",
  "soundfile>=0.12,<1",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
  "matplotlib>=3.7,<4",
  "tqdm>=4.66,<5",
  "torch>=2.2,<3",
  "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]
